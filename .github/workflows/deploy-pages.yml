name: CMS içeriğini siteye uygula

on:
  push:
    branches: [main]
    paths:
      - ".pages.yml"
      - "content/**"
      - "assets/images/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: Node.js hazırla
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: pnpm hazırla
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Siteyi oluştur
        run: pnpm run build
      - name: Oluşturulan sayfaları ana dala aktar
        run: |
          cp dist/index.html index.html
          cp dist/icerikler.html icerikler.html
          cp dist/sitemap.xml sitemap.xml
          mkdir -p yazilar
          rsync -a --delete dist/yazilar/ yazilar/
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html icerikler.html sitemap.xml yazilar
          if git diff --cached --quiet; then
            echo "Yayımlanacak yeni çıktı yok."
          else
            git commit -m "Siteyi CMS içeriğiyle güncelle [skip ci]"
            git push
          fi
