name: Siteyi yayımla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: Node.js hazırla
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: pnpm hazırla
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile
      - name: Siteyi oluştur
        run: pnpm run build
      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5
      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
